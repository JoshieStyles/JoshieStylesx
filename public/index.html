<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivox Free Fire Premium Sensitivity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 {
            color: #ff4757;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: translateY(-1px);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #cbd5e1;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #ff4757;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #ff4757;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }
        button:hover {
            background: #ff6b81;
        }
        .results {
            margin-top: 25px;
            padding: 20px;
            background: #0f172a;
            border-radius: 8px;
            border-left: 4px solid #ff4757;
            display: none;
        }
        .results h3 {
            margin-bottom: 15px;
            color: #2ed573;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .badge {
            background: #ff4757;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 Nivox FF Sensitivity</h1>

    <a href="https://whatsapp.com/channel/0029VbDGZd50rGiDqYtYNW1o" target="_blank" class="whatsapp-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
        </svg>
        Join my WhatsApp channel
    </a>
    
    <div class="form-group">
        <label for="ram">Device RAM</label>
        <select id="ram">
            <option value="3">2GB - 4GB RAM (Budget)</option>
            <option value="6" selected>6GB RAM (Mid-Range)</option>
            <option value="8">8GB+ RAM (High-End / Flagship)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="dpi">Custom DPI (Optional)</label>
        <input type="number" id="dpi" placeholder="e.g. 480 (Default if empty)">
    </div>

    <div class="form-group">
        <label for="playstyle">Combat Playstyle</label>
        <select id="playstyle">
            <option value="onetap">One-Tap Headshot (Desert Eagle / Woodpecker)</option>
            <option value="smg">SMG Drag & Spray (MP40 / Thompson)</option>
            <option value="balanced">Balanced All-Rounder</option>
        </select>
    </div>

    <button onclick="generateConfig()">Generate 9/10 Headshot Config</button>

    <div class="results" id="results">
        <h3>🎯 Optimized Sensitivity</h3>
        <div class="stat-row"><span>General:</span><strong id="val-general">0</strong></div>
        <div class="stat-row"><span>Red Dot:</span><strong id="val-reddot">0</strong></div>
        <div class="stat-row"><span>2X Scope:</span><strong id="val-scope2x">0</strong></div>
        <div class="stat-row"><span>4X Scope:</span><strong id="val-scope4x">0</strong></div>
        <div class="stat-row"><span>Sniper Scope:</span><strong id="val-sniper">0</strong></div>
        <div class="stat-row"><span>Free Look:</span><strong id="val-freelook">0</strong></div>
        
        <h3 style="margin-top: 15px; color: #ffa502;">⚙️ Companion Settings</h3>
        <div class="stat-row"><span>Fire Button Size:</span><strong id="val-firesize">40%</strong></div>
        <div class="stat-row"><span>Aim Precision:</span><strong id="val-precision">Default</strong></div>
        <div class="stat-row"><span>Button Position:</span><strong>Lower-Middle</strong></div>
    </div>
</div>

<script>
async function generateConfig() {
    const ram = document.getElementById('ram').value;
    const dpi = document.getElementById('dpi').value;
    const playstyle = document.getElementById('playstyle').value;

    try {
        const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ram, dpi, playstyle })
        });
        const data = await response.json();

        document.getElementById('val-general').innerText = data.general;
        document.getElementById('val-reddot').innerText = data.redDot;
        document.getElementById('val-scope2x').innerText = data.scope2x;
        document.getElementById('val-scope4x').innerText = data.scope4x;
        document.getElementById('val-sniper').innerText = data.sniper;
        document.getElementById('val-freelook').innerText = data.freeLook;
        document.getElementById('val-firesize').innerText = data.recommendedFireSize;
        document.getElementById('val-precision').innerText = data.aimPrecision;

        document.getElementById('results').style.display = 'block';
    } catch (err) {
        alert('Failed to generate settings. Make sure backend server is running.');
    }
}
</script>

</body>
</html>
